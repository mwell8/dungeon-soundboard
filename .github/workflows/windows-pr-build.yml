name: Windows PR Build

on:
  pull_request:
    branches: ["main"]
    paths:
      - "windows/**"
      - "README-Windows.md"
      - ".github/workflows/windows-pr-build.yml"
  push:
    branches: ["windows-port", "codex/**"]
    paths:
      - "windows/**"
      - "README-Windows.md"
      - ".github/workflows/windows-pr-build.yml"

jobs:
  windows-build-and-test:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Windows solution
        run: dotnet restore .\DungeonSoundboard.Windows.sln

      - name: Build Windows solution
        run: dotnet build .\DungeonSoundboard.Windows.sln -c Release --no-restore -warnaserror

      - name: Run Windows unit tests
        run: dotnet test .\DungeonSoundboard.Windows.sln -c Release --no-build

      - name: Restore Windows publish runtime
        run: dotnet restore .\src\DungeonSoundboard.App\DungeonSoundboard.App.csproj -r win-x64

      - name: Publish Windows CI zip
        shell: pwsh
        run: .\scripts\publish-windows.ps1 -Configuration Release -Runtime win-x64 -SkipRestore -SkipTests

      - name: Upload Windows CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dungeon-Soundboard-Windows-ci
          path: windows/publish/Dungeon-Soundboard-Windows-win-x64.zip
          if-no-files-found: error
