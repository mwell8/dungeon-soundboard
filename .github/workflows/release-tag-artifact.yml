name: Release Artifacts On Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-release-artifact:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Release app (unsigned)
        run: |
          xcodebuild \
            -project "Dungeon Soundboard.xcodeproj" \
            -scheme "Dungeon_Soundboard" \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath ".DerivedDataReleaseCI" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Pack macOS release zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p Release
          cp -R ".DerivedDataReleaseCI/Build/Products/Release/Dungeon Soundboard.app" Release/
          ditto -c -k --sequesterRsrc --keepParent \
            "Release/Dungeon Soundboard.app" \
            "Release/Dungeon-Soundboard-${VERSION}-macOS-unsigned.zip"

      - name: Upload macOS workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dungeon-Soundboard-macOS
          path: Release/Dungeon-Soundboard-*-macOS-unsigned.zip
          if-no-files-found: error

  windows-release-artifact:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Windows solution
        run: dotnet restore .\DungeonSoundboard.Windows.sln

      - name: Build Windows solution
        run: dotnet build .\DungeonSoundboard.Windows.sln -c Release --no-restore

      - name: Run Windows unit tests
        run: dotnet test .\DungeonSoundboard.Windows.sln -c Release --no-build

      - name: Publish Windows app
        run: dotnet publish .\src\DungeonSoundboard.App\DungeonSoundboard.App.csproj -c Release -r win-x64 --self-contained true -o .\publish\win-x64

      - name: Pack Windows release zip
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          New-Item -ItemType Directory -Force -Path .\publish | Out-Null
          Compress-Archive -Path .\publish\win-x64\* -DestinationPath ".\publish\Dungeon-Soundboard-$version-Windows-win-x64.zip" -Force

      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dungeon-Soundboard-Windows
          path: windows/publish/Dungeon-Soundboard-*-Windows-win-x64.zip
          if-no-files-found: error

  github-release:
    runs-on: ubuntu-latest
    needs:
      - macos-release-artifact
      - windows-release-artifact

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: ReleaseAssets
          merge-multiple: true

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ReleaseAssets/*.zip
