name: PR Debug Build

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "codex/**"]

jobs:
  build-and-test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version

      - name: Run project checks
        run: scripts/check_project.sh
