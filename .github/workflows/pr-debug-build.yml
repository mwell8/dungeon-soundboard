name: PR Debug Build

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "codex/**"]

jobs:
  macos-build-and-test:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build macOS app (Debug, unsigned)
        run: |
          xcodebuild \
            -project "Dungeon Soundboard.xcodeproj" \
            -scheme "Dungeon_Soundboard" \
            -configuration Debug \
            -sdk macosx \
            -derivedDataPath ".DerivedDataCI" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Run core unit tests
        run: swift test --disable-sandbox --scratch-path .build --cache-path .swiftpm-cache

  windows-build-and-test:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Windows solution
        run: dotnet restore .\DungeonSoundboard.Windows.sln

      - name: Build Windows solution
        run: dotnet build .\DungeonSoundboard.Windows.sln -c Release --no-restore

      - name: Run Windows unit tests
        run: dotnet test .\DungeonSoundboard.Windows.sln -c Release --no-build

      - name: Publish Windows app
        run: dotnet publish .\src\DungeonSoundboard.App\DungeonSoundboard.App.csproj -c Release -r win-x64 --self-contained true -o .\publish\ci-win-x64
